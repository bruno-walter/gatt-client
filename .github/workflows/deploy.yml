name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd gatt-client-public
          npm install 2>/dev/null || echo "No package.json found"

      - name: Build (if needed)
        run: |
          cd gatt-client-public
          # No build step needed - this is a static site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gatt-client-public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4